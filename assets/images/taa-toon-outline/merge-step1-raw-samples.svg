<svg viewBox="0 0 580 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="580" height="400" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="290" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Step 1: Where Each Pixel's Samples Land</text>

  <!-- three square pixels, drawn apart so stored positions past a pixel's boundary stay visible -->
  <rect x="40"  y="80" width="120" height="120" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="230" y="80" width="120" height="120" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="420" y="80" width="120" height="120" fill="#ffffff" stroke="#333" stroke-width="1.5"/>

  <!-- A: R2 -->
  <polygon points="76,80 160,80 160,200 100,200" fill="#4e79a7" fill-opacity="0.30"/>
  <!-- B: L1 and R1 -->
  <polygon points="230,80 266,80 290,200 230,200" fill="#e0a030" fill-opacity="0.30"/>
  <polygon points="266,80 350,80 350,200 290,200" fill="#4e79a7" fill-opacity="0.30"/>
  <!-- C: L2 -->
  <polygon points="420,80 456,80 480,200 420,200" fill="#e0a030" fill-opacity="0.30"/>

  <!-- phantom thresholds in A and C, true edge in B -->
  <line x1="76" y1="80" x2="100" y2="200" stroke="#888" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="456" y1="80" x2="480" y2="200" stroke="#888" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="266" y1="80" x2="290" y2="200" stroke="#1b1b1b" stroke-width="3"/>

  <!-- pixel labels -->
  <text x="100" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#555">A</text>
  <text x="290" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#555">B</text>
  <text x="480" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#555">C</text>

  <!-- dataset labels -->
  <text x="132" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#2e5c8a">R2</text>
  <text x="250" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#a5740f">L1</text>
  <text x="322" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#2e5c8a">R1</text>
  <text x="440" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#a5740f">L2</text>

  <!-- legend -->
  <line x1="40" y1="240" x2="58" y2="240" stroke="#1b1b1b" stroke-width="3"/>
  <text x="66" y="244" font-size="12" fill="#333">the true edge, inside B</text>

  <line x1="40" y1="262" x2="58" y2="262" stroke="#888" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="66" y="266" font-size="12" fill="#333">the same threshold, in a neighbor's own local frame</text>

  <rect x="40" y="280" width="18" height="18" fill="#4e79a7" fill-opacity="0.30"/>
  <text x="66" y="293" font-size="12" fill="#333">R1 (B's left-inducer detections) and R2 (A's right-inducer detections): same frames</text>

  <rect x="40" y="304" width="18" height="18" fill="#e0a030" fill-opacity="0.30"/>
  <text x="66" y="317" font-size="12" fill="#333">L1 (B's right-inducer detections) and L2 (C's left-inducer detections): same frames</text>

  <text x="290" y="355" text-anchor="middle" font-size="11" fill="#555">Each pixel records samples in its own local coordinates, so a shared sample</text>
  <text x="290" y="372" text-anchor="middle" font-size="11" fill="#555">sits at the same spot within A's square as within B's.</text>
</svg>

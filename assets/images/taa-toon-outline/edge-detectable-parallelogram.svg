<svg viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2e6fa3" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="440" height="300" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="220" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Edge-Detectable Area Across Three Pixels</text>

  <!-- three horizontally adjacent pixels -->
  <rect x="40"  y="70" width="120" height="120" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/> <!-- left -->
  <rect x="160" y="70" width="120" height="120" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/> <!-- center -->
  <rect x="280" y="70" width="120" height="120" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/> <!-- right -->

  <!-- parallelogram: edge-detectable area, two render pixels wide, edge as its middle line -->
  <polygon points="70,70 310,70 370,190 130,190" fill="#4e79a7" fill-opacity="0.15" stroke="#2e6fa3" stroke-width="1.5"/>
  <polygon points="70,70 310,70 370,190 130,190" fill="url(#hatch)"/>

  <!-- the actual geometric edge, slanted, running through the center pixel as the parallelogram's middle line -->
  <line x1="190" y1="70" x2="250" y2="190" stroke="#1b1b1b" stroke-width="3"/>

  <!-- legend -->
  <rect x="40" y="235" width="18" height="18" fill="#4e79a7" fill-opacity="0.15" stroke="#2e6fa3" stroke-width="1.5"/>
  <rect x="40" y="235" width="18" height="18" fill="url(#hatch)"/>
  <text x="66" y="248" font-size="12" fill="#333">edge-detectable area (two render pixels wide, edge is its middle line)</text>

  <line x1="40" y1="265" x2="58" y2="265" stroke="#1b1b1b" stroke-width="3"/>
  <text x="66" y="269" font-size="12" fill="#333">actual geometric edge</text>

  <text x="220" y="295" text-anchor="middle" font-size="11" fill="#555">A jittered sample pair only detects this edge if it falls inside the hatched band.</text>
</svg>

<svg viewBox="0 0 530 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="530" height="440" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="265" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#222">B Gets Both Datasets; Its Neighbors Each Get Only Half</text>

  <!-- three square pixels -->
  <rect x="40" y="80" width="150" height="150" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="190" y="80" width="150" height="150" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="340" y="80" width="150" height="150" fill="#ffffff" stroke="#333" stroke-width="1.5"/>

  <!-- A: only its right trapezoid is used (R2, shifted copy of R1) -->
  <polygon points="85,80 190,80 190,230 115,230" fill="#4e79a7" fill-opacity="0.30" stroke="none"/>

  <!-- B: both trapezoids are used (R1 and L1) -->
  <polygon points="235,80 340,80 340,230 265,230" fill="#4e79a7" fill-opacity="0.30" stroke="none"/>
  <polygon points="190,80 235,80 265,230 190,230" fill="#e0a030" fill-opacity="0.30" stroke="none"/>

  <!-- C: only its left trapezoid is used (L2, shifted copy of L1) -->
  <polygon points="340,80 385,80 415,230 340,230" fill="#e0a030" fill-opacity="0.30" stroke="none"/>

  <!-- phantom (reused-threshold) lines in A and C -->
  <line x1="85" y1="80" x2="115" y2="230" stroke="#888888" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="385" y1="80" x2="415" y2="230" stroke="#888888" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- the real edge, in B -->
  <line x1="235" y1="80" x2="265" y2="230" stroke="#1b1b1b" stroke-width="3"/>

  <!-- pixel labels -->
  <text x="115" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#555">A</text>
  <text x="265" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#555">B</text>
  <text x="415" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#555">C</text>

  <!-- dataset labels -->
  <text x="140" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#2e5c8a">R2</text>
  <text x="228" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#a5740f">L1</text>
  <text x="300" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#2e5c8a">R1</text>
  <text x="362" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#a5740f">L2</text>

  <!-- per-pixel captions -->
  <text x="115" y="255" text-anchor="middle" font-size="11" fill="#555">only R2 &#8212; half the picture</text>
  <text x="265" y="255" text-anchor="middle" font-size="11" fill="#555">L1 and R1 &#8212; the full picture</text>
  <text x="415" y="255" text-anchor="middle" font-size="11" fill="#555">only L2 &#8212; half the picture</text>

  <!-- legend -->
  <line x1="40" y1="290" x2="58" y2="290" stroke="#1b1b1b" stroke-width="3"/>
  <text x="66" y="294" font-size="12" fill="#333">the true edge, inside B</text>

  <line x1="40" y1="312" x2="58" y2="312" stroke="#888888" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="66" y="316" font-size="12" fill="#333">the same threshold, replotted in a neighbor's own local frame</text>

  <rect x="40" y="330" width="18" height="18" fill="#4e79a7" fill-opacity="0.30"/>
  <text x="66" y="343" font-size="12" fill="#333">R1 / R2: B's right-check dataset, shared with A's right-check</text>

  <rect x="40" y="352" width="18" height="18" fill="#e0a030" fill-opacity="0.30"/>
  <text x="66" y="365" font-size="12" fill="#333">L1 / L2: B's left-check dataset, shared with C's left-check</text>

  <text x="265" y="395" text-anchor="middle" font-size="11" fill="#555">B draws on both datasets for a strong, two-sided fit. A and C each</text>
  <text x="265" y="412" text-anchor="middle" font-size="11" fill="#555">only see one side of it — a noisier, one-sided proxy for the same edge.</text>
</svg>

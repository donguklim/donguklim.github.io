<svg viewBox="0 0 440 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch6" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2e6fa3" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="440" height="360" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="220" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Recovering the Edge with OLS (Left-Neighbor Comparison)</text>

  <!-- three horizontally adjacent pixels -->
  <rect x="40"  y="70" width="120" height="120" fill="#c9a0dc" stroke="#333" stroke-width="1.5"/> <!-- left: different surface -->
  <rect x="160" y="70" width="120" height="120" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
  <rect x="280" y="70" width="120" height="120" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>

  <!-- the part of the center pixel left of the edge belongs to the same surface as the left pixel -->
  <polygon points="160,70 190,70 250,190 160,190" fill="#c9a0dc"/>

  <!-- right-side half of the parallelogram: the edge-detectable band vs. the left neighbor -->
  <polygon points="190,70 310,70 370,190 250,190" fill="#4e79a7" fill-opacity="0.15" stroke="#2e6fa3" stroke-width="1.5"/>
  <polygon points="190,70 310,70 370,190 250,190" fill="url(#hatch6)"/>

  <!-- the actual geometric edge -->
  <line x1="190" y1="70" x2="250" y2="190" stroke="#1b1b1b" stroke-width="3"/>

  <!-- scattered detected jitter samples, accumulated over many frames, filling the whole band -->
  <circle cx="216.5" cy="75"  r="3" fill="#111111"/>
  <circle cx="274.5" cy="83"  r="3" fill="#111111"/>
  <circle cx="248.5" cy="91"  r="3" fill="#111111"/>
  <circle cx="300.5" cy="99"  r="3" fill="#111111"/>
  <circle cx="226.5" cy="107" r="3" fill="#111111"/>
  <circle cx="278.5" cy="115" r="3" fill="#111111"/>
  <circle cx="324.5" cy="123" r="3" fill="#111111"/>
  <circle cx="256.5" cy="131" r="3" fill="#111111"/>
  <circle cx="308.5" cy="139" r="3" fill="#111111"/>
  <circle cx="282.5" cy="147" r="3" fill="#111111"/>
  <circle cx="334.5" cy="155" r="3" fill="#111111"/>
  <circle cx="266.5" cy="163" r="3" fill="#111111"/>
  <circle cx="312.5" cy="171" r="3" fill="#111111"/>
  <circle cx="286.5" cy="179" r="3" fill="#111111"/>
  <circle cx="338.5" cy="187" r="3" fill="#111111"/>

  <!-- OLS-fitted trend line through the middle of the parallelogram -->
  <line x1="250" y1="70" x2="310" y2="190" stroke="#d62728" stroke-width="2.5"/>

  <!-- legend -->
  <rect x="40" y="235" width="18" height="18" fill="#4e79a7" fill-opacity="0.15" stroke="#2e6fa3" stroke-width="1.5"/>
  <rect x="40" y="235" width="18" height="18" fill="url(#hatch6)"/>
  <text x="66" y="248" font-size="12" fill="#333">edge-detectable area vs. the left neighbor</text>

  <circle cx="49" cy="266" r="3" fill="#111111"/>
  <text x="66" y="270" font-size="12" fill="#333">detected jitter sample (one per frame, accumulated over time)</text>

  <line x1="40" y1="290" x2="58" y2="290" stroke="#1b1b1b" stroke-width="3"/>
  <text x="66" y="294" font-size="12" fill="#333">actual geometric edge</text>

  <line x1="40" y1="312" x2="58" y2="312" stroke="#d62728" stroke-width="2.5"/>
  <text x="66" y="316" font-size="12" fill="#333">OLS-fitted trend line (through the middle of the parallelogram)</text>

  <text x="220" y="330" text-anchor="middle" font-size="11" fill="#555">Fitting a line through the sample cloud recovers the parallelogram's middle line,</text>
  <text x="220" y="345" text-anchor="middle" font-size="11" fill="#555">parallel to the true edge.</text>
</svg>

<svg viewBox="0 0 580 370" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrS3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a02020"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="580" height="370" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="290" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Step 3: Each Neighbor's Data Sits Half a Pixel From B's</text>

  <rect x="40"  y="80" width="120" height="120" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="230" y="80" width="120" height="120" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="420" y="80" width="120" height="120" fill="#ffffff" stroke="#333" stroke-width="1.5"/>

  <!-- same state as step 2 -->
  <polygon points="136,80 220,80 220,200 160,200" fill="#4e79a7" fill-opacity="0.30" stroke="#4e79a7" stroke-width="1.5"/>
  <polygon points="266,80 350,80 350,200 290,200" fill="#4e79a7" fill-opacity="0.30"/>
  <polygon points="290,80 326,80 350,200 290,200" fill="#e0a030" fill-opacity="0.40" stroke="#c98a1a" stroke-width="1.5"/>
  <polygon points="420,80 456,80 480,200 420,200" fill="#e0a030" fill-opacity="0.30"/>

  <line x1="266" y1="80" x2="290" y2="200" stroke="#1b1b1b" stroke-width="3"/>

  <text x="100" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#555">A</text>
  <text x="290" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#555">B</text>
  <text x="480" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#555">C</text>

  <text x="196" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#2e5c8a">R2</text>
  <text x="330" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#2e5c8a">R1</text>
  <text x="318" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#a5740f">L1</text>
  <text x="440" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#a5740f">L2</text>

  <!-- R2 <-> R1: R1 is R2 translated by exactly +130px, so these two points
       sit at the same relative spot in each trapezoid -->
  <circle cx="212" cy="92" r="3.5" fill="#a02020"/>
  <circle cx="342" cy="92" r="3.5" fill="#a02020"/>
  <line x1="219" y1="92" x2="335" y2="92" stroke="#a02020" stroke-width="2" marker-start="url(#arrS3)" marker-end="url(#arrS3)"/>
  <text x="215" y="74" text-anchor="middle" font-size="11" font-weight="600" fill="#a02020">0.5 apart</text>

  <!-- L1 <-> L2: L2 is shifted L1 translated by exactly +130px -->
  <circle cx="310" cy="160" r="3.5" fill="#a02020"/>
  <circle cx="440" cy="160" r="3.5" fill="#a02020"/>
  <line x1="317" y1="160" x2="433" y2="160" stroke="#a02020" stroke-width="2" marker-start="url(#arrS3)" marker-end="url(#arrS3)"/>
  <text x="385" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#a02020">0.5 apart</text>

  <!-- legend -->
  <rect x="40" y="228" width="18" height="18" fill="#bbbbbb" fill-opacity="0.45" stroke="#555" stroke-width="1.5"/>
  <text x="66" y="241" font-size="12" fill="#333">outlined: right-inducer detections for that pixel, shifted +&#189; in step 2</text>

  <rect x="40" y="252" width="18" height="18" fill="#bbbbbb" fill-opacity="0.45"/>
  <text x="66" y="265" font-size="12" fill="#333">no outline: left-inducer detections, kept as they are (blue = R1/R2, orange = L1/L2)</text>

  <line x1="40" y1="285" x2="58" y2="285" stroke="#a02020" stroke-width="2"/>
  <text x="66" y="289" font-size="12" fill="#333">the same samples, stored half a pixel apart in the two pixels' estimators</text>

  <text x="290" y="330" text-anchor="middle" font-size="11" fill="#555">A's shifted R2 and B's R1 hold the same samples, as do B's shifted L1 and C's L2.</text>
  <text x="290" y="347" text-anchor="middle" font-size="11" fill="#555">Shifting each neighbor's estimator by that half pixel lines it up with B's.</text>
</svg>

<svg viewBox="0 0 530 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="530" height="470" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="265" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Edge Near B's Left Boundary: L1 and L2 Shrink to Slivers</text>

  <!-- three square pixels -->
  <rect x="40" y="80" width="150" height="150" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="190" y="80" width="150" height="150" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="340" y="80" width="150" height="150" fill="#ffffff" stroke="#333" stroke-width="1.5"/>

  <!-- A: R2 -->
  <polygon points="49,80 190,80 190,230 61,230" fill="#4e79a7" fill-opacity="0.30" stroke="none"/>

  <!-- B: L1 (sliver) and R1 -->
  <polygon points="199,80 340,80 340,230 211,230" fill="#4e79a7" fill-opacity="0.30" stroke="none"/>
  <polygon points="190,80 199,80 211,230 190,230" fill="#e0a030" fill-opacity="0.55" stroke="none"/>

  <!-- C: L2 (sliver) -->
  <polygon points="340,80 349,80 361,230 340,230" fill="#e0a030" fill-opacity="0.55" stroke="none"/>

  <!-- phantom (reused-threshold) lines in A and C -->
  <line x1="49" y1="80" x2="61" y2="230" stroke="#888888" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="349" y1="80" x2="361" y2="230" stroke="#888888" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- the real edge, in B, close to B's left boundary -->
  <line x1="199" y1="80" x2="211" y2="230" stroke="#1b1b1b" stroke-width="3"/>

  <!-- pixel labels -->
  <text x="115" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#555">A</text>
  <text x="265" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#555">B</text>
  <text x="415" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#555">C</text>

  <!-- dataset labels; the slivers get leader lines -->
  <text x="130" y="165" text-anchor="middle" font-size="13" font-weight="600" fill="#2e5c8a">R2</text>
  <text x="280" y="165" text-anchor="middle" font-size="13" font-weight="600" fill="#2e5c8a">R1</text>
  <line x1="200" y1="212" x2="222" y2="252" stroke="#a5740f" stroke-width="1"/>
  <text x="226" y="262" font-size="13" font-weight="600" fill="#a5740f">L1</text>
  <line x1="350" y1="212" x2="372" y2="252" stroke="#a5740f" stroke-width="1"/>
  <text x="376" y="262" font-size="13" font-weight="600" fill="#a5740f">L2</text>

  <!-- per-pixel captions -->
  <text x="115" y="290" text-anchor="middle" font-size="11" fill="#555">R2 covers almost all of A</text>
  <text x="265" y="290" text-anchor="middle" font-size="11" fill="#555">a sliver of L1, and a large R1</text>
  <text x="415" y="290" text-anchor="middle" font-size="11" fill="#555">only a sliver of L2</text>

  <!-- legend -->
  <line x1="40" y1="320" x2="58" y2="320" stroke="#1b1b1b" stroke-width="3"/>
  <text x="66" y="324" font-size="12" fill="#333">the true edge, inside B, close to B's left boundary</text>

  <line x1="40" y1="342" x2="58" y2="342" stroke="#888888" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="66" y="346" font-size="12" fill="#333">the same threshold, replotted in a neighbor's own local frame</text>

  <rect x="40" y="360" width="18" height="18" fill="#4e79a7" fill-opacity="0.30"/>
  <text x="66" y="373" font-size="12" fill="#333">R1 / R2: B's left-inducer dataset, shared with A's right-inducer check</text>

  <rect x="40" y="382" width="18" height="18" fill="#e0a030" fill-opacity="0.55"/>
  <text x="66" y="395" font-size="12" fill="#333">L1 / L2: B's right-inducer dataset, shared with C's left-inducer check</text>

  <text x="265" y="428" text-anchor="middle" font-size="11" fill="#555">With the edge this close to B's left boundary, L1 and L2 hold very few samples,</text>
  <text x="265" y="445" text-anchor="middle" font-size="11" fill="#555">so all three pixels' merged datasets end up dominated by R1.</text>
</svg>

<svg viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowShift1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555555"/>
    </marker>
    <marker id="arrowShift2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="460" height="380" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="230" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Detected and Not-Detected Trapezoids Share a Fixed 0.5-Pixel Shift</text>

  <!-- single pixel -->
  <rect x="140" y="70" width="200" height="200" fill="#ffffff" stroke="#333" stroke-width="1.5"/>

  <!-- detected trapezoid (right-inducer check): 0 <= x <= A+By -->
  <polygon points="140,70 200,70 290,270 140,270" fill="#4e79a7" fill-opacity="0.22" stroke="#2e6fa3" stroke-width="1.5"/>

  <!-- not-detected trapezoid: complement -->
  <polygon points="200,70 340,70 340,270 290,270" fill="#f2994a" fill-opacity="0.20" stroke="#c97a1f" stroke-width="1.5"/>

  <!-- the actual geometric edge -->
  <line x1="200" y1="70" x2="290" y2="270" stroke="#1b1b1b" stroke-width="3"/>

  <!-- detected trapezoid midline -->
  <line x1="170" y1="70" x2="215" y2="270" stroke="#d62728" stroke-width="2.5"/>

  <!-- not-detected trapezoid midline -->
  <line x1="270" y1="70" x2="315" y2="270" stroke="#8e44ad" stroke-width="2.5"/>

  <!-- shift arrow between the two midlines at mid-height -->
  <line x1="192.5" y1="170" x2="292.5" y2="170" stroke="#555555" stroke-width="2" marker-start="url(#arrowShift2)" marker-end="url(#arrowShift1)"/>
  <text x="242.5" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#333">0.5 px shift</text>

  <!-- axis labels -->
  <text x="140" y="290" font-size="12" fill="#555">x=0</text>
  <text x="332" y="290" font-size="12" fill="#555">x=1</text>

  <!-- legend -->
  <rect x="40" y="300" width="18" height="18" fill="#4e79a7" fill-opacity="0.22" stroke="#2e6fa3" stroke-width="1.5"/>
  <text x="66" y="313" font-size="12" fill="#333">detected trapezoid (right-inducer check): fit x = a + by</text>

  <rect x="40" y="322" width="18" height="18" fill="#f2994a" fill-opacity="0.20" stroke="#c97a1f" stroke-width="1.5"/>
  <text x="66" y="335" font-size="12" fill="#333">not-detected trapezoid: fit x = a_nd + b_nd y = (a + 0.5) + by</text>

  <line x1="40" y1="349" x2="58" y2="349" stroke="#1b1b1b" stroke-width="3"/>
  <text x="66" y="353" font-size="12" fill="#333">actual geometric edge</text>

  <text x="230" y="370" text-anchor="middle" font-size="11" fill="#555">Subtracting 0.5 from the not-detected fit's intercept recovers the detected trapezoid's own midline.</text>
</svg>

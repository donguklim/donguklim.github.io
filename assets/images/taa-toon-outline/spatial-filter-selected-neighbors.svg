<svg viewBox="0 0 380 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="380" height="400" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="190" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Spatial Filter: Select the Most-Overlapping Neighbors</text>

  <!-- 3x3 grid of pixels -->
  <rect x="40"  y="50"  width="100" height="100" fill="#f6c453" stroke="#333" stroke-width="1.5"/> <!-- selected: top-left -->
  <rect x="140" y="50"  width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
  <rect x="240" y="50"  width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>

  <rect x="40"  y="150" width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
  <rect x="140" y="150" width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/> <!-- target pixel -->
  <rect x="240" y="150" width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>

  <rect x="40"  y="250" width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
  <rect x="140" y="250" width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
  <rect x="240" y="250" width="100" height="100" fill="#f6c453" stroke="#333" stroke-width="1.5"/> <!-- selected: bottom-right -->

  <!-- extension of the edge out to the grid boundary, in both directions -->
  <line x1="160" y1="150" x2="100" y2="50"  stroke="#1b1b1b" stroke-width="2" stroke-dasharray="7,5"/>
  <line x1="220" y1="250" x2="280" y2="350" stroke="#1b1b1b" stroke-width="2" stroke-dasharray="7,5"/>

  <!-- the target pixel's own reconstructed edge -->
  <line x1="160" y1="150" x2="220" y2="250" stroke="#1b1b1b" stroke-width="3"/>

  <!-- points where the extended edge reaches the grid boundary -->
  <circle cx="100" cy="50"  r="5" fill="#d62728"/>
  <circle cx="280" cy="350" r="5" fill="#d62728"/>

  <text x="190" y="368" text-anchor="middle" font-size="12" fill="#555">the top-left and bottom-right pixels are the most</text>
  <text x="190" y="384" text-anchor="middle" font-size="12" fill="#555">overlapping neighbor in each extended direction</text>
</svg>

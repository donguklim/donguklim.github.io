<svg viewBox="0 0 580 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrS2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="580" height="420" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="290" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Step 2: Each Pixel Folds Its Samples Into Its Left-Inducer Estimator</text>

  <rect x="40"  y="80" width="120" height="120" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="230" y="80" width="120" height="120" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="420" y="80" width="120" height="120" fill="#ffffff" stroke="#333" stroke-width="1.5"/>

  <!-- original positions, dashed outlines -->
  <polygon points="76,80 160,80 160,200 100,200" fill="none" stroke="#4e79a7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="230,80 266,80 290,200 230,200" fill="none" stroke="#c98a1a" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- A: R2 shifted +0.5, running past A's own boundary -->
  <polygon points="136,80 220,80 220,200 160,200" fill="#4e79a7" fill-opacity="0.30" stroke="#4e79a7" stroke-width="1.5"/>
  <!-- B: R1 kept; L1 shifted +0.5, landing inside R1 -->
  <polygon points="266,80 350,80 350,200 290,200" fill="#4e79a7" fill-opacity="0.30"/>
  <polygon points="290,80 326,80 350,200 290,200" fill="#e0a030" fill-opacity="0.40" stroke="#c98a1a" stroke-width="1.5"/>
  <!-- C: L2 kept -->
  <polygon points="420,80 456,80 480,200 420,200" fill="#e0a030" fill-opacity="0.30"/>

  <line x1="266" y1="80" x2="290" y2="200" stroke="#1b1b1b" stroke-width="3"/>

  <text x="100" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#555">A</text>
  <text x="290" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#555">B</text>
  <text x="480" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#555">C</text>

  <text x="196" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#2e5c8a">R2</text>
  <text x="322" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#2e5c8a">R1</text>
  <text x="318" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#a5740f">L1</text>
  <text x="440" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#a5740f">L2</text>

  <!-- shift arrows, one half-pixel (60px) long -->
  <line x1="100" y1="222" x2="158" y2="222" stroke="#333" stroke-width="2" marker-end="url(#arrS2)"/>
  <text x="129" y="240" text-anchor="middle" font-size="11" fill="#333">R2: +&#189;</text>
  <line x1="236" y1="222" x2="294" y2="222" stroke="#333" stroke-width="2" marker-end="url(#arrS2)"/>
  <text x="265" y="240" text-anchor="middle" font-size="11" fill="#333">L1: +&#189;</text>
  <text x="325" y="240" text-anchor="middle" font-size="11" fill="#333">R1: kept</text>
  <text x="480" y="240" text-anchor="middle" font-size="11" fill="#333">L2: kept</text>

  <!-- legend -->
  <polygon points="40,264 58,264 58,280 40,280" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="66" y="277" font-size="12" fill="#333">where the samples landed (step 1)</text>

  <rect x="40" y="288" width="18" height="18" fill="#bbbbbb" fill-opacity="0.45" stroke="#555" stroke-width="1.5"/>
  <text x="66" y="301" font-size="12" fill="#333">outlined: right-inducer detections for that pixel, shifted +&#189;</text>

  <rect x="40" y="312" width="18" height="18" fill="#bbbbbb" fill-opacity="0.45"/>
  <text x="66" y="325" font-size="12" fill="#333">no outline: left-inducer detections, kept as they are (blue = R1/R2, orange = L1/L2)</text>

  <text x="290" y="365" text-anchor="middle" font-size="11" fill="#555">B's shifted L1 now overlaps R1, and A's shifted R2 runs past A's own boundary.</text>
  <text x="290" y="382" text-anchor="middle" font-size="11" fill="#555">Each pixel only shifts the samples that are right-inducer detections for that pixel.</text>
</svg>

<svg viewBox="0 0 500 485" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="500" height="485" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="250" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#222">1st Approach: One Segment per Column; 2nd Approach: Gaps and Doubles</text>

  <!-- ===== Panel 1: 1st approach ===== -->
  <text x="85" y="70" font-size="12" font-weight="600" fill="#333">1st approach</text>

  <!-- pixel grid, 6 columns x 2 rows -->
  <rect x="85"  y="80" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="140" y="80" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="195" y="80" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="250" y="80" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="305" y="80" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="360" y="80" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="85"  y="135" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="140" y="135" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="195" y="135" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="250" y="135" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="305" y="135" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="360" y="135" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="85" y="80" width="330" height="110" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="85" y1="135" x2="415" y2="135" stroke="#333" stroke-width="1.5"/>

  <!-- the true edge: low-angle diagonal from top row to bottom row -->
  <line x1="85" y1="80" x2="415" y2="190" stroke="#1b1b1b" stroke-width="3"/>

  <!-- reconstructed edges: one per column, some in the wrong row -->
  <line x1="85"  y1="90"  x2="140" y2="108" stroke="#d62728" stroke-width="2.5"/> <!-- col0, correct (top) -->
  <line x1="140" y1="108" x2="195" y2="127" stroke="#d62728" stroke-width="2.5"/> <!-- col1, correct (top) -->
  <line x1="195" y1="140" x2="250" y2="155" stroke="#d62728" stroke-width="2.5"/> <!-- col2, WRONG (bottom) -->
  <line x1="250" y1="150" x2="305" y2="165" stroke="#d62728" stroke-width="2.5"/> <!-- col3, correct (bottom) -->
  <line x1="305" y1="160" x2="360" y2="178" stroke="#d62728" stroke-width="2.5"/> <!-- col4, correct (bottom) -->
  <line x1="360" y1="178" x2="415" y2="190" stroke="#d62728" stroke-width="2.5"/> <!-- col5, correct (bottom) -->

  <!-- ===== Panel 2: 2nd approach ===== -->
  <text x="85" y="230" font-size="12" font-weight="600" fill="#333">2nd approach</text>

  <rect x="85"  y="240" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="140" y="240" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="195" y="240" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="250" y="240" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="305" y="240" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="360" y="240" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="85"  y="295" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="140" y="295" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="195" y="295" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="250" y="295" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="305" y="295" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="360" y="295" width="55" height="55" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="85" y="240" width="330" height="110" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="85" y1="295" x2="415" y2="295" stroke="#333" stroke-width="1.5"/>

  <!-- the same true edge -->
  <line x1="85" y1="240" x2="415" y2="350" stroke="#1b1b1b" stroke-width="3"/>

  <!-- reconstructed edges: col2 has none (gap), col3 has two (double) -->
  <line x1="85"  y1="250" x2="140" y2="268" stroke="#d62728" stroke-width="2.5"/> <!-- col0, correct (top) -->
  <line x1="140" y1="268" x2="195" y2="287" stroke="#d62728" stroke-width="2.5"/> <!-- col1, correct (top) -->
  <!-- col2: intentionally no reconstructed edge -->
  <line x1="250" y1="280" x2="305" y2="292" stroke="#d62728" stroke-width="2.5"/> <!-- col3, top copy -->
  <line x1="250" y1="300" x2="305" y2="318" stroke="#d62728" stroke-width="2.5"/> <!-- col3, bottom copy -->
  <line x1="305" y1="320" x2="360" y2="338" stroke="#d62728" stroke-width="2.5"/> <!-- col4, correct (bottom) -->
  <line x1="360" y1="338" x2="415" y2="350" stroke="#d62728" stroke-width="2.5"/> <!-- col5, correct (bottom) -->

  <!-- callouts, both under panel 2 (the only panel with a gap or a double) -->
  <text x="222" y="368" text-anchor="middle" font-size="11" fill="#a02020">no reconstructed edge &#8594; gap</text>
  <text x="278" y="384" text-anchor="middle" font-size="11" fill="#a02020">both rows draw &#8594; thick</text>

  <!-- legend -->
  <line x1="85" y1="405" x2="103" y2="405" stroke="#1b1b1b" stroke-width="3"/>
  <text x="111" y="409" font-size="12" fill="#333">the true edge (low angle, top row to bottom row)</text>

  <line x1="85" y1="427" x2="103" y2="427" stroke="#d62728" stroke-width="2.5"/>
  <text x="111" y="431" font-size="12" fill="#333">a reconstructed edge, one drawn per column</text>

  <text x="250" y="452" text-anchor="middle" font-size="11" fill="#555">1st approach always draws exactly one segment per column, even when noise puts it in the wrong row.</text>
  <text x="250" y="467" text-anchor="middle" font-size="11" fill="#555">2nd approach can drop a column entirely or draw it in both rows at once.</text>
</svg>

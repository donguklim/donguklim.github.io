<svg viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowCoLeft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d62728"/>
    </marker>
    <marker id="arrowCoRight" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d62728"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="460" height="380" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="230" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Two Close Edges Can Trigger Both Checks at Once</text>

  <!-- single pixel, three bands -->
  <rect x="140" y="70" width="200" height="200" fill="#ffffff" stroke="#333" stroke-width="1.5"/>

  <!-- left band: same surface as left neighbor -->
  <polygon points="140,70 190,70 210,270 140,270" fill="#f7f7f7" stroke="#333" stroke-width="1"/>

  <!-- middle sliver: third surface, narrower than one pixel -->
  <polygon points="190,70 250,70 270,270 210,270" fill="#c9a0dc" stroke="#333" stroke-width="1"/>

  <!-- right band: same surface as right neighbor -->
  <polygon points="250,70 340,70 340,270 270,270" fill="#e8e8e8" stroke="#333" stroke-width="1"/>

  <!-- edge 1 -->
  <line x1="190" y1="70" x2="210" y2="270" stroke="#1b1b1b" stroke-width="3"/>
  <!-- edge 2 -->
  <line x1="250" y1="70" x2="270" y2="270" stroke="#1b1b1b" stroke-width="3"/>

  <!-- co-trigger jitter sample inside the sliver -->
  <circle cx="230" cy="170" r="6" fill="#d62728" stroke="#ffffff" stroke-width="1.5"/>

  <!-- arrows from the sample to both neighbors -->
  <line x1="200" y1="170" x2="140" y2="170" stroke="#d62728" stroke-width="2" marker-end="url(#arrowCoLeft)"/>
  <line x1="260" y1="170" x2="340" y2="170" stroke="#d62728" stroke-width="2" marker-end="url(#arrowCoRight)"/>

  <text x="170" y="160" text-anchor="middle" font-size="11" fill="#a02020">detected vs. left</text>
  <text x="300" y="160" text-anchor="middle" font-size="11" fill="#a02020">detected vs. right</text>

  <!-- legend -->
  <rect x="40" y="300" width="18" height="18" fill="#c9a0dc" stroke="#333" stroke-width="1"/>
  <text x="66" y="313" font-size="12" fill="#333">third surface, narrower than one pixel</text>

  <circle cx="49" cy="332" r="6" fill="#d62728" stroke="#ffffff" stroke-width="1.5"/>
  <text x="66" y="336" font-size="12" fill="#333">co-trigger jitter sample: detected against both neighbors at once</text>

  <text x="230" y="360" text-anchor="middle" font-size="11" fill="#555">The single-edge assumption behind the direction-merging trick breaks down here.</text>
</svg>

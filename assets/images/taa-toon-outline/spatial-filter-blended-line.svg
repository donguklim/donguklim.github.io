<svg viewBox="0 0 380 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="380" height="400" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="190" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Spatial Filter: The Blended Line</text>

  <!-- 3x3 grid of pixels -->
  <rect x="40"  y="50"  width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/> <!-- top-left neighbor -->
  <rect x="140" y="50"  width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
  <rect x="240" y="50"  width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>

  <rect x="40"  y="150" width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
  <rect x="140" y="150" width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/> <!-- target pixel -->
  <rect x="240" y="150" width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>

  <rect x="40"  y="250" width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
  <rect x="140" y="250" width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
  <rect x="240" y="250" width="100" height="100" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/> <!-- bottom-right neighbor -->

  <!-- the blended line: one continuous line spanning the grid, threading through the three separate estimates -->
  <line x1="123" y1="50" x2="253" y2="350" stroke="#2e6fa3" stroke-width="3.5" stroke-linecap="round"/>

  <!-- the top-left neighbor's own reconstructed edge: slightly different slope and intercept -->
  <line x1="75" y1="50" x2="115" y2="150" stroke="#1b1b1b" stroke-width="3"/>

  <!-- the target pixel's own reconstructed edge -->
  <line x1="160" y1="150" x2="220" y2="250" stroke="#1b1b1b" stroke-width="3"/>

  <!-- the bottom-right neighbor's own reconstructed edge: slightly different slope and intercept -->
  <line x1="265" y1="250" x2="295" y2="350" stroke="#1b1b1b" stroke-width="3"/>

  <text x="190" y="368" text-anchor="middle" font-size="12" fill="#555">the blue line is built by blending the three black line</text>
  <text x="190" y="384" text-anchor="middle" font-size="12" fill="#555">segments' historical estimator variables</text>
</svg>

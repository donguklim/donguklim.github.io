<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="620" height="400" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#222">The Velocity Test: a Foot's Records on the Floor</text>

  <!-- ===== last frame: the foot covers pixels 0 to 2, its edge at 2.5 pixel units ===== -->
  <text x="60" y="52" font-size="12" font-weight="600" fill="#333">last frame</text>
  <polygon points="60,60 231,60 239,130 60,130" fill="#c9a0dc" fill-opacity="0.45"/>
  <g fill="none" stroke="#333" stroke-width="1.5">
    <rect x="60" y="60" width="70" height="70"/><rect x="130" y="60" width="70" height="70"/><rect x="200" y="60" width="70" height="70"/><rect x="270" y="60" width="70" height="70"/><rect x="340" y="60" width="70" height="70"/><rect x="410" y="60" width="70" height="70"/>
  </g>
  <line x1="231" y1="60" x2="239" y2="130" stroke="#1b1b1b" stroke-width="3"/>
  <text x="130" y="100" text-anchor="middle" font-size="11" fill="#5a3d6b">foot, 1 px per frame →</text>
  <text x="445" y="100" text-anchor="middle" font-size="11" fill="#777">floor, static</text>
  <rect x="180" y="138" width="110" height="18" rx="3" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="235" y="151" text-anchor="middle" font-size="10" fill="#333">record, stored v = 1 →</text>

  <!-- ===== this frame: the foot moved one pixel right, its edge at 3.5 pixel units ===== -->
  <text x="60" y="242" font-size="12" font-weight="600" fill="#333">this frame</text>
  <polygon points="60,250 301,250 309,320 60,320" fill="#c9a0dc" fill-opacity="0.45"/>
  <g fill="none" stroke="#333" stroke-width="1.5">
    <rect x="60" y="250" width="70" height="70"/><rect x="130" y="250" width="70" height="70"/><rect x="200" y="250" width="70" height="70"/><rect x="270" y="250" width="70" height="70"/><rect x="340" y="250" width="70" height="70"/><rect x="410" y="250" width="70" height="70"/>
  </g>
  <line x1="301" y1="250" x2="309" y2="320" stroke="#1b1b1b" stroke-width="3"/>
  <text x="235" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="#333">P</text>
  <text x="298" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Q</text>
  <text x="235" y="308" text-anchor="middle" font-size="9.5" fill="#777">floor now</text>
  <text x="302" y="308" text-anchor="middle" font-size="9.5" fill="#5a3d6b">foot's edge</text>

  <!-- fetches: P straight up with object velocity 0 (dropped), Q one pixel to the left with velocity 1 (kept) -->
  <line x1="235" y1="250" x2="228" y2="158" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <circle cx="231" cy="204" r="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="227" y1="200" x2="235" y2="208" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="235" y1="200" x2="227" y2="208" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="305" y1="250" x2="245" y2="158" stroke="#2e8b57" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <circle cx="278" cy="209" r="8" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
  <polyline points="273,209 277,213 284,205" fill="none" stroke="#2e8b57" stroke-width="1.8"/>

  <g font-size="10.5" fill="#333" text-anchor="end">
    <text x="218" y="185">P: floor, object velocity 0,</text>
    <text x="218" y="199">fetches straight up.</text>
    <text x="218" y="213" fill="#c0392b">The tap was stored with 1: left out.</text>
  </g>
  <g font-size="10.5" fill="#333">
    <text x="322" y="185">Q: the foot's edge, object velocity 1,</text>
    <text x="322" y="199">fetches one pixel to the left.</text>
    <text x="322" y="213" fill="#2e8b57">The tap was stored with 1: kept.</text>
  </g>

  <g font-size="10.5" fill="#555">
    <text x="60" y="348">Each pixel stores the object velocity its records moved with: its own velocity minus the camera's share,</text>
    <text x="60" y="363">which is exactly 0 for anything static. A tap is left out when its stored velocity differs from the fetching</text>
    <text x="60" y="378">pixel's by more than 0.5 px per frame plus half that pixel's own speed. The foot's record is not carried onto the floor.</text>
  </g>
</svg>

<svg viewBox="0 0 760 505" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="505" fill="#ffffff" stroke="#e0e0e0" rx="8"/>
  <text x="380" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Where One Edge's Records Are, and Two Edges Two Pixels Apart</text>
  <text x="100.0" y="114.0" text-anchor="end" font-size="10.5" fill="#333" font-weight="600">one edge</text>
  <g fill="none" stroke="#333" stroke-width="1.5">
    <rect x="110.0" y="60.0" width="100" height="100"/>
    <rect x="210.0" y="60.0" width="100" height="100"/>
    <rect x="310.0" y="60.0" width="100" height="100"/>
    <rect x="410.0" y="60.0" width="100" height="100"/>
    <rect x="510.0" y="60.0" width="100" height="100"/>
  </g>
  <text x="160.0" y="52.0" text-anchor="middle" font-size="10.5" fill="#777">p−2</text>
  <text x="260.0" y="52.0" text-anchor="middle" font-size="10.5" fill="#777">p−1</text>
  <text x="360.0" y="52.0" text-anchor="middle" font-size="10.5" fill="#777">p</text>
  <text x="460.0" y="52.0" text-anchor="middle" font-size="10.5" fill="#777">p+1</text>
  <text x="560.0" y="52.0" text-anchor="middle" font-size="10.5" fill="#777">p+2</text>
  <line x1="380.0" y1="60.0" x2="380.0" y2="160.0" stroke="#1b1b1b" stroke-width="3"/>
  <text x="386.0" y="152.0" text-anchor="start" font-size="10" fill="#333">E = p + 0.7</text>
  <rect x="214.0" y="178.0" width="92" height="34" rx="3" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="260.0" y="191.0" text-anchor="middle" font-size="9.5" fill="#333">record:</text>
  <text x="260.0" y="204.0" text-anchor="middle" font-size="9" fill="#333">right-check samples</text>
  <text x="260.0" y="228.0" text-anchor="middle" font-size="9" fill="#c0392b">decodes to 1.7, outside</text>
  <line x1="260.0" y1="178.0" x2="380.0" y2="162.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
  <rect x="314.0" y="178.0" width="92" height="34" rx="3" fill="#ffffff" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="360.0" y="191.0" text-anchor="middle" font-size="9.5" fill="#333">record:</text>
  <text x="360.0" y="204.0" text-anchor="middle" font-size="9" fill="#333">both checks</text>
  <text x="360.0" y="228.0" text-anchor="middle" font-size="9" fill="#2e8b57">decodes to 0.7, inside</text>
  <line x1="360.0" y1="178.0" x2="380.0" y2="162.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
  <rect x="414.0" y="178.0" width="92" height="34" rx="3" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="460.0" y="191.0" text-anchor="middle" font-size="9.5" fill="#333">record:</text>
  <text x="460.0" y="204.0" text-anchor="middle" font-size="9" fill="#333">left-check samples</text>
  <text x="460.0" y="228.0" text-anchor="middle" font-size="9" fill="#c0392b">decodes to −0.3, outside</text>
  <line x1="460.0" y1="178.0" x2="380.0" y2="162.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
  <text x="360.0" y="252.0" text-anchor="middle" font-size="10.5" fill="#333">three pixels hold records of one edge, and each record points at it: only p "contains" the edge</text>
  <text x="100.0" y="332.0" text-anchor="end" font-size="10.5" fill="#333" font-weight="600">two edges</text>
  <text x="100.0" y="346.0" text-anchor="end" font-size="10.5" fill="#333" font-weight="600">2 px apart</text>
  <g fill="none" stroke="#333" stroke-width="1.5">
    <rect x="110.0" y="278.0" width="100" height="100"/>
    <rect x="210.0" y="278.0" width="100" height="100"/>
    <rect x="310.0" y="278.0" width="100" height="100"/>
    <rect x="410.0" y="278.0" width="100" height="100"/>
    <rect x="510.0" y="278.0" width="100" height="100"/>
  </g>
  <text x="160.0" y="270.0" text-anchor="middle" font-size="10.5" fill="#777">p−1</text>
  <text x="260.0" y="270.0" text-anchor="middle" font-size="10.5" fill="#777">p</text>
  <text x="360.0" y="270.0" text-anchor="middle" font-size="10.5" fill="#777">p+1</text>
  <text x="460.0" y="270.0" text-anchor="middle" font-size="10.5" fill="#777">p+2</text>
  <text x="560.0" y="270.0" text-anchor="middle" font-size="10.5" fill="#777">p+3</text>
  <line x1="280.0" y1="278.0" x2="280.0" y2="378.0" stroke="#1b1b1b" stroke-width="3"/>
  <line x1="480.0" y1="278.0" x2="480.0" y2="378.0" stroke="#1b1b1b" stroke-width="3"/>
  <text x="286.0" y="370.0" text-anchor="start" font-size="10" fill="#333">E1</text>
  <text x="486.0" y="370.0" text-anchor="start" font-size="10" fill="#333">E2</text>
  <rect x="114.0" y="396.0" width="92" height="34" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="160.0" y="409.0" text-anchor="middle" font-size="9.5" fill="#333">record:</text>
  <text x="160.0" y="422.0" text-anchor="middle" font-size="8.5" fill="#333">E1, right</text>
  <rect x="214.0" y="396.0" width="92" height="34" rx="3" fill="#ffffff" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="260.0" y="409.0" text-anchor="middle" font-size="9.5" fill="#333">record:</text>
  <text x="260.0" y="422.0" text-anchor="middle" font-size="8.5" fill="#333">E1, both</text>
  <rect x="314.0" y="396.0" width="92" height="34" rx="3" fill="#ffffff" stroke="#b36b00" stroke-width="1.2"/>
  <text x="360.0" y="409.0" text-anchor="middle" font-size="9.5" fill="#333">record:</text>
  <text x="360.0" y="422.0" text-anchor="middle" font-size="8.5" fill="#333">E1 left + E2 right</text>
  <rect x="414.0" y="396.0" width="92" height="34" rx="3" fill="#ffffff" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="460.0" y="409.0" text-anchor="middle" font-size="9.5" fill="#333">record:</text>
  <text x="460.0" y="422.0" text-anchor="middle" font-size="8.5" fill="#333">E2, both</text>
  <rect x="514.0" y="396.0" width="92" height="34" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="560.0" y="409.0" text-anchor="middle" font-size="9.5" fill="#333">record:</text>
  <text x="560.0" y="422.0" text-anchor="middle" font-size="8.5" fill="#333">E2, left</text>
  <text x="160.0" y="446.0" text-anchor="middle" font-size="9" fill="#2e8b57">drawn</text>
  <text x="260.0" y="446.0" text-anchor="middle" font-size="9" fill="#2e8b57">drawn: contains E1</text>
  <text x="360.0" y="446.0" text-anchor="middle" font-size="9" fill="#c0392b">mixed: suppressed</text>
  <text x="460.0" y="446.0" text-anchor="middle" font-size="9" fill="#2e8b57">drawn: contains E2</text>
  <text x="560.0" y="446.0" text-anchor="middle" font-size="9" fill="#777">nothing to draw</text>
  <text x="360.0" y="470.0" text-anchor="middle" font-size="10" fill="#333">p+1 sees an edge inside the pixel on each side whose fit crosses elsewhere than its own: another edge on both sides</text>
  <text x="380.0" y="491.0" text-anchor="middle" font-size="10.5" fill="#777">The horizontal axis; a record decodes to the edge position 2 μ_u − 1 at its mean v, no slope needed</text>
</svg>

<svg viewBox="0 0 560 390" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="560" height="390" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="280" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Pooling a Pixel's Record With Its Neighbours'</text>

  <!-- three pixels A, B, C -->
  <rect x="100" y="55" width="120" height="120" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
  <rect x="220" y="55" width="120" height="120" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
  <rect x="340" y="55" width="120" height="120" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>

  <!-- sample regions: A's right part (blue, copy of R1), B's left (orange, L1) and right (blue, R1), C's left (orange, copy of L1) -->
  <polygon points="160,55 220,55 220,175 170,175" fill="#4e79a7" fill-opacity="0.35"/>
  <polygon points="220,55 272,55 284,175 220,175" fill="#f28e2b" fill-opacity="0.35"/>
  <polygon points="272,55 340,55 340,175 284,175" fill="#4e79a7" fill-opacity="0.35"/>
  <polygon points="340,55 392,55 404,175 340,175" fill="#f28e2b" fill-opacity="0.35"/>

  <!-- the true edge inside B -->
  <line x1="272" y1="55" x2="284" y2="175" stroke="#1b1b1b" stroke-width="3"/>

  <!-- pixel labels -->
  <text x="160" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#333">A</text>
  <text x="280" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#333">B</text>
  <text x="400" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#333">C</text>

  <!-- record boxes -->
  <rect x="110" y="212" width="100" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2" rx="4"/>
  <text x="160" y="232" text-anchor="middle" font-size="12" fill="#333">record A, n<tspan font-size="9" baseline-shift="sub">A</tspan></text>
  <rect x="230" y="212" width="100" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2" rx="4"/>
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#333">record B, n<tspan font-size="9" baseline-shift="sub">B</tspan></text>
  <rect x="350" y="212" width="100" height="30" fill="#ffffff" stroke="#333" stroke-width="1.2" rx="4"/>
  <text x="400" y="232" text-anchor="middle" font-size="12" fill="#333">record C, n<tspan font-size="9" baseline-shift="sub">C</tspan></text>

  <!-- arrows into the pool -->
  <line x1="160" y1="242" x2="245" y2="292" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="242" x2="280" y2="292" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="242" x2="315" y2="292" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="150" y="276" text-anchor="end" font-size="11" fill="#333">shift −½ along the axis</text>
  <text x="292" y="270" text-anchor="start" font-size="11" fill="#333">as is</text>
  <text x="410" y="276" text-anchor="start" font-size="11" fill="#333">shift +½ along the axis</text>

  <!-- pool box -->
  <rect x="175" y="294" width="210" height="46" fill="#eef3f8" stroke="#2e6fa3" stroke-width="1.5" rx="4"/>
  <text x="280" y="313" text-anchor="middle" font-size="12" fill="#222">pool, weighted by n<tspan font-size="9" baseline-shift="sub">A</tspan>, n<tspan font-size="9" baseline-shift="sub">B</tspan>, n<tspan font-size="9" baseline-shift="sub">C</tspan></text>
  <text x="280" y="331" text-anchor="middle" font-size="12" fill="#222">→ OLS fit → B's edge line</text>

  <!-- result arrow back to the edge -->
  <path d="M 385 317 C 470 317, 480 110, 300 110" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>

  <!-- legend -->
  <rect x="24" y="356" width="14" height="14" fill="#4e79a7" fill-opacity="0.35" stroke="#333" stroke-width="0.8"/>
  <text x="44" y="367" font-size="11" fill="#333">samples of B's left check (also A's right check)</text>
  <rect x="300" y="356" width="14" height="14" fill="#f28e2b" fill-opacity="0.35" stroke="#333" stroke-width="0.8"/>
  <text x="320" y="367" font-size="11" fill="#333">samples of B's right check (also C's left check)</text>
</svg>

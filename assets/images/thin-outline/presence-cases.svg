  <text x="20" y="536.0" font-size="10.5" fill="#555">Each frame p moves a quarter of the way toward 1 if the edge is found at the pixel, toward 0 if not; a new</text>
  <text x="20" y="551.0" font-size="10.5" fill="#555">record starts at 0.25, and a record whose p falls below 0.05 is emptied. The strength drawn is the ramp from</text>
  <text x="20" y="566.0" font-size="10.5" fill="#555">0 at p = 0.3 to 1 at p = 1, written under each axis. A new edge reaches 0.9 after about nine frames; a crease</text>
  <text x="20" y="581.0" font-size="10.5" fill="#555">found on every other frame draws at 0.18 and 0.39 in turn; a pop on one frame in four peaks at 0.09; a ghost</text>
  <text x="20" y="596.0" font-size="10.5" fill="#555">is faint after three frames without its edge and emptied on the eleventh.</text>

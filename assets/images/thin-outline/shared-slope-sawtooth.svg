<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="440" fill="#ffffff" stroke="#e0e0e0" rx="8"/>
  <text x="320" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#222">A Static Vertical Edge: Every Row Fits the Same Leaning Line</text>
  <g fill="none" stroke="#333" stroke-width="1.5">
    <rect x="90.0" y="60.0" width="100" height="100"/>
    <rect x="190.0" y="60.0" width="100" height="100"/>
    <rect x="90.0" y="160.0" width="100" height="100"/>
    <rect x="190.0" y="160.0" width="100" height="100"/>
    <rect x="90.0" y="260.0" width="100" height="100"/>
    <rect x="190.0" y="260.0" width="100" height="100"/>
  </g>
  <g stroke="#bbb" stroke-width="1" stroke-dasharray="3 3">
    <line x1="90.0" y1="110.0" x2="290.0" y2="110.0"/>
    <line x1="90.0" y1="210.0" x2="290.0" y2="210.0"/>
    <line x1="90.0" y1="310.0" x2="290.0" y2="310.0"/>
  </g>
  <text x="82.0" y="114.0" text-anchor="end" font-size="10.5" fill="#777">row 199</text>
  <text x="82.0" y="214.0" text-anchor="end" font-size="10.5" fill="#777">row 200</text>
  <text x="82.0" y="314.0" text-anchor="end" font-size="10.5" fill="#777">row 201</text>
  <text x="140.0" y="52.0" text-anchor="middle" font-size="10.5" fill="#777">column 117</text>
  <text x="240.0" y="52.0" text-anchor="middle" font-size="10.5" fill="#777">column 118</text>
  <line x1="182.9" y1="60.0" x2="182.9" y2="360.0" stroke="#2e8b57" stroke-width="2" stroke-dasharray="7 5"/>
  <g stroke="#c0392b" stroke-width="2.5">
    <line x1="164.4" y1="60.0" x2="201.4" y2="160.0"/>
    <line x1="164.4" y1="160.0" x2="201.4" y2="260.0"/>
    <line x1="164.4" y1="260.0" x2="201.4" y2="360.0"/>
  </g>
  <g fill="#1f5fbf">
    <circle cx="182.9" cy="110.0" r="4.5"/>
    <circle cx="182.9" cy="210.0" r="4.5"/>
    <circle cx="182.9" cy="310.0" r="4.5"/>
  </g>
  <line x1="164.4" y1="374.0" x2="201.4" y2="374.0" stroke="#333" stroke-width="1.2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="182.9" y="390.0" text-anchor="middle" font-size="10.5" fill="#333">b = 0.37 px of lean per row</text>
  <text x="320.0" y="70.0" text-anchor="start" font-size="10.5" fill="#2e8b57">dashed green: the true edge, vertical</text>
  <text x="320.0" y="84.0" text-anchor="start" font-size="10.5" fill="#2e8b57">(slope 0), at u = 0.93</text>
  <text x="320.0" y="114.0" text-anchor="start" font-size="10.5" fill="#c0392b">red: the fitted line of each row,</text>
  <text x="320.0" y="128.0" text-anchor="start" font-size="10.5" fill="#c0392b">a = 0.744, b = 0.37, the same in every row</text>
  <text x="320.0" y="142.0" text-anchor="start" font-size="10.5" fill="#c0392b">because every row holds the same samples</text>
  <text x="320.0" y="172.0" text-anchor="start" font-size="10.5" fill="#1f5fbf">blue: the centre crossing u_c = a + b/2 = 0.93,</text>
  <text x="320.0" y="186.0" text-anchor="start" font-size="10.5" fill="#1f5fbf">the same in every row, and on the true edge</text>
  <text x="320.0" y="216.0" text-anchor="start" font-size="10.5" fill="#333">the drawn line leans 0.37 px from the top to</text>
  <text x="320.0" y="230.0" text-anchor="start" font-size="10.5" fill="#333">the bottom of each rendering pixel row and</text>
  <text x="320.0" y="244.0" text-anchor="start" font-size="10.5" fill="#333">jumps back at the next row: a sawtooth</text>
  <text x="320.0" y="274.0" text-anchor="start" font-size="10.5" fill="#777">dotted grey: display pixel rows at 50%</text>
  <text x="320.0" y="288.0" text-anchor="start" font-size="10.5" fill="#777">screen percentage, two per rendering row</text>
  <text x="320.0" y="426.0" text-anchor="middle" font-size="10.5" fill="#777">Static frame, 50% screen percentage, 1280×720; the horizontal axis (u = x along it, v = y across it)</text>
</svg>

<svg viewBox="0 0 620 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="620" height="500" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Nearest-Pixel Fetch: the Edge Walks Away From Its Record</text>

  <!-- ===== frame 0: edge at 1.5 pixel units (inside B) ===== -->
  <text x="50" y="52" font-size="12" font-weight="600" fill="#333">frame 0</text>
  <g fill="none" stroke="#333" stroke-width="1.5">
    <rect x="50" y="60" width="70" height="70"/><rect x="120" y="60" width="70" height="70"/><rect x="190" y="60" width="70" height="70"/><rect x="260" y="60" width="70" height="70"/><rect x="330" y="60" width="70" height="70"/>
  </g>
  <g font-size="11" fill="#777">
    <text x="56" y="74">A</text><text x="126" y="74">B</text><text x="196" y="74">C</text><text x="266" y="74">D</text><text x="336" y="74">E</text>
  </g>
  <line x1="151" y1="60" x2="159" y2="130" stroke="#1b1b1b" stroke-width="3"/>
  <rect x="120" y="150" width="70" height="18" rx="3" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="155" y="163" text-anchor="middle" font-size="10" fill="#333">B's record</text>
  <line x1="50" y1="178" x2="260" y2="178" stroke="#2e6fa3" stroke-width="1.2"/>
  <line x1="50" y1="174" x2="50" y2="182" stroke="#2e6fa3" stroke-width="1.2"/>
  <line x1="260" y1="174" x2="260" y2="182" stroke="#2e6fa3" stroke-width="1.2"/>
  <g font-size="10.5" fill="#333">
    <text x="415" y="76">The edge is inside B, and B's</text>
    <text x="415" y="90">record holds its samples, n ≈ 25.</text>
    <text x="415" y="104">The edge moves 0.3 px per frame</text>
    <text x="415" y="118">to the right.</text>
    <text x="415" y="140" fill="#2e6fa3">The blue bracket marks the edges</text>
    <text x="415" y="154" fill="#2e6fa3">B can sample: those in A, B or C.</text>
  </g>

  <!-- ===== frame 3: edge at 2.4 pixel units (inside C) ===== -->
  <text x="50" y="197" font-size="12" font-weight="600" fill="#333">frame 3</text>
  <g fill="none" stroke="#333" stroke-width="1.5">
    <rect x="50" y="205" width="70" height="70"/><rect x="120" y="205" width="70" height="70"/><rect x="190" y="205" width="70" height="70"/><rect x="260" y="205" width="70" height="70"/><rect x="330" y="205" width="70" height="70"/>
  </g>
  <g font-size="11" fill="#777">
    <text x="56" y="219">A</text><text x="126" y="219">B</text><text x="196" y="219">C</text><text x="266" y="219">D</text><text x="336" y="219">E</text>
  </g>
  <line x1="214" y1="205" x2="222" y2="275" stroke="#1b1b1b" stroke-width="3"/>
  <!-- B's centre traced back by 0.3 px (21 px) lands in B -->
  <circle cx="155" cy="240" r="3.5" fill="#333"/>
  <line x1="155" y1="240" x2="136" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <circle cx="134" cy="240" r="2.5" fill="#555"/>
  <text x="145" y="232" text-anchor="middle" font-size="9" fill="#555">0.3 px</text>
  <rect x="120" y="295" width="70" height="18" rx="3" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="155" y="308" text-anchor="middle" font-size="10" fill="#333">B's record</text>
  <line x1="188" y1="295" x2="216" y2="243" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <line x1="50" y1="323" x2="260" y2="323" stroke="#2e6fa3" stroke-width="1.2"/>
  <line x1="50" y1="319" x2="50" y2="327" stroke="#2e6fa3" stroke-width="1.2"/>
  <line x1="260" y1="319" x2="260" y2="327" stroke="#2e6fa3" stroke-width="1.2"/>
  <g font-size="10.5" fill="#333">
    <text x="415" y="221">The edge moved 0.9 px, into C.</text>
    <text x="415" y="235">B's centre traced back 0.3 px lands</text>
    <text x="415" y="249">in B, so B fetches its own record</text>
    <text x="415" y="263">and shifts it by −0.15 along u. It</text>
    <text x="415" y="277">still decodes to the edge (dashed</text>
    <text x="415" y="291">arrow), which is still within reach.</text>
  </g>

  <!-- ===== frame 6: edge at 3.3 pixel units (inside D) ===== -->
  <text x="50" y="342" font-size="12" font-weight="600" fill="#333">frame 6</text>
  <g fill="none" stroke="#333" stroke-width="1.5">
    <rect x="50" y="350" width="70" height="70"/><rect x="120" y="350" width="70" height="70"/><rect x="190" y="350" width="70" height="70"/><rect x="260" y="350" width="70" height="70"/><rect x="330" y="350" width="70" height="70"/>
  </g>
  <g font-size="11" fill="#777">
    <text x="56" y="364">A</text><text x="126" y="364">B</text><text x="196" y="364">C</text><text x="266" y="364">D</text><text x="336" y="364">E</text>
  </g>
  <line x1="277" y1="350" x2="285" y2="420" stroke="#1b1b1b" stroke-width="3"/>
  <circle cx="155" cy="385" r="3.5" fill="#333"/>
  <line x1="155" y1="385" x2="136" y2="385" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <circle cx="134" cy="385" r="2.5" fill="#555"/>
  <text x="145" y="377" text-anchor="middle" font-size="9" fill="#555">0.3 px</text>
  <rect x="120" y="440" width="70" height="18" rx="3" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="155" y="453" text-anchor="middle" font-size="10" fill="#333">B's record</text>
  <line x1="188" y1="440" x2="279" y2="389" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <line x1="50" y1="468" x2="260" y2="468" stroke="#2e6fa3" stroke-width="1.2"/>
  <line x1="50" y1="464" x2="50" y2="472" stroke="#2e6fa3" stroke-width="1.2"/>
  <line x1="260" y1="464" x2="260" y2="472" stroke="#2e6fa3" stroke-width="1.2"/>
  <text x="155" y="482" text-anchor="middle" font-size="10" fill="#c0392b">the edge is out of B's range</text>
  <g font-size="10.5" fill="#333">
    <text x="415" y="366">The edge is 1.8 px right, in D,</text>
    <text x="415" y="380">out of B's reach. B's record still</text>
    <text x="415" y="394">decodes to the edge but never gets</text>
    <text x="415" y="408">another sample, and lingers while</text>
    <text x="415" y="422">its count decays by 4% per frame.</text>
  </g>
</svg>

<svg viewBox="0 0 620 345" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="bc-grid"><rect x="60" y="60" width="500" height="100"/></clipPath>
  </defs>
  <rect x="0" y="0" width="620" height="345" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Drawing the Silhouette Band From the Foreground's Records</text>

  <!-- foreground fill -->
  <rect x="60" y="60" width="200" height="100" fill="#c9a0dc" fill-opacity="0.45"/>
  <polygon points="260,60 300,60 310,160 260,160" fill="#c9a0dc" fill-opacity="0.45"/>
  <!-- the band on the background side: from the contour, 0.7 px toward +u -->
  <polygon points="300,60 370,60 380,160 310,160" fill="#555" fill-opacity="0.75" clip-path="url(#bc-grid)"/>
  <!-- pixels -->
  <g fill="none" stroke="#333" stroke-width="1.5">
    <rect x="60" y="60" width="100" height="100"/><rect x="160" y="60" width="100" height="100"/><rect x="260" y="60" width="100" height="100"/><rect x="360" y="60" width="100" height="100"/><rect x="460" y="60" width="100" height="100"/>
  </g>
  <!-- contour -->
  <line x1="300" y1="60" x2="310" y2="160" stroke="#1b1b1b" stroke-width="3"/>
  <!-- pixel labels -->
  <g font-size="13" font-weight="600" fill="#555" text-anchor="middle">
    <text x="110" y="180">Z</text><text x="210" y="180">A</text><text x="310" y="180">B</text><text x="410" y="180">C</text><text x="510" y="180">D</text>
  </g>
  <!-- record icons under A and B -->
  <rect x="190" y="190" width="40" height="18" rx="3" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="210" y="203" text-anchor="middle" font-size="10" fill="#333">rec A</text>
  <rect x="290" y="190" width="40" height="18" rx="3" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="310" y="203" text-anchor="middle" font-size="10" fill="#333">rec B</text>

  <!-- pools -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="110" y="236">A: pools Z, A</text>
    <text x="110" y="250" fill="#777">only its own record,</text>
    <text x="110" y="264" fill="#777">band outside: draws nothing</text>
    <text x="310" y="236" font-weight="600">B: pools A, B</text>
    <text x="310" y="250" font-weight="600">draws</text>
    <text x="410" y="236" font-weight="600">C: pools A, B</text>
    <text x="410" y="250" font-weight="600">draws</text>
    <text x="410" y="264" fill="#777">(B, its foreground</text>
    <text x="410" y="278" fill="#777">neighbour, holds a record)</text>
    <text x="510" y="236">D: no record</text>
    <text x="510" y="250" fill="#777">in D or C:</text>
    <text x="510" y="264" fill="#777">draws nothing</text>
  </g>

  <!-- legend -->
  <rect x="60" y="292" width="14" height="14" fill="#c9a0dc" fill-opacity="0.45" stroke="#333" stroke-width="0.8"/>
  <text x="80" y="303" font-size="11" fill="#333">foreground</text>
  <rect x="170" y="292" width="14" height="14" fill="#555" fill-opacity="0.75"/>
  <text x="190" y="303" font-size="11" fill="#333">outline band, on the background side only</text>
  <line x1="420" y1="299" x2="440" y2="299" stroke="#1b1b1b" stroke-width="3"/>
  <text x="446" y="303" font-size="11" fill="#333">contour</text>
  <text x="310" y="320" text-anchor="middle" font-size="10" fill="#555">Per axis and background side, a pixel pools itself, the two toward the foreground and the one toward the background,</text>
  <text x="310" y="332" text-anchor="middle" font-size="10" fill="#555">if it or its foreground neighbour holds a record of that side.</text>
</svg>

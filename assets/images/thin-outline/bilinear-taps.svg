<svg viewBox="0 0 620 370" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="370" fill="#ffffff" stroke="#e0e0e0" rx="8"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Bilinear History Taps</text>

  <!-- 3x3 grid of history pixels, 80 px each, origin (60, 70) -->
  <g fill="#f7f7f7" stroke="#333" stroke-width="1.5">
    <rect x="60" y="70" width="80" height="80"/><rect x="140" y="70" width="80" height="80"/><rect x="220" y="70" width="80" height="80"/>
    <rect x="60" y="150" width="80" height="80"/><rect x="140" y="150" width="80" height="80"/><rect x="220" y="150" width="80" height="80"/>
    <rect x="60" y="230" width="80" height="80"/><rect x="140" y="230" width="80" height="80"/><rect x="220" y="230" width="80" height="80"/>
  </g>
  <!-- pixel centres -->
  <g fill="#999">
    <circle cx="100" cy="110" r="2.5"/><circle cx="180" cy="110" r="2.5"/><circle cx="260" cy="110" r="2.5"/>
    <circle cx="100" cy="190" r="2.5"/><circle cx="180" cy="190" r="2.5"/><circle cx="260" cy="190" r="2.5"/>
    <circle cx="100" cy="270" r="2.5"/><circle cx="180" cy="270" r="2.5"/><circle cx="260" cy="270" r="2.5"/>
  </g>
  <!-- tap indices (column, row) in the four tap pixels -->
  <g font-size="9.5" fill="#777">
    <text x="144" y="81">(1, 0)</text><text x="224" y="81">(2, 0)</text>
    <text x="144" y="161">(1, 1)</text><text x="224" y="161">(2, 1)</text>
  </g>
  <!-- the quad between the four tap centres -->
  <rect x="180" y="110" width="80" height="80" fill="none" stroke="#2e6fa3" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- this pixel's square, traced back by its velocity, centred at P = (196, 182) -->
  <rect x="156" y="142" width="80" height="80" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <circle cx="196" cy="182" r="4" fill="#c0392b"/>
  <!-- fractions: f_x = 0.2 along the top of the quad, f_y = 0.9 down its left side -->
  <line x1="180" y1="100" x2="196" y2="100" stroke="#2e6fa3" stroke-width="1.2"/>
  <line x1="180" y1="97" x2="180" y2="103" stroke="#2e6fa3" stroke-width="1.2"/>
  <line x1="196" y1="97" x2="196" y2="103" stroke="#2e6fa3" stroke-width="1.2"/>
  <text x="188" y="94" text-anchor="middle" font-size="10" fill="#2e6fa3">f<tspan font-size="7" baseline-shift="sub">x</tspan> = 0.2</text>
  <line x1="170" y1="110" x2="170" y2="182" stroke="#2e6fa3" stroke-width="1.2"/>
  <line x1="167" y1="110" x2="173" y2="110" stroke="#2e6fa3" stroke-width="1.2"/>
  <line x1="167" y1="182" x2="173" y2="182" stroke="#2e6fa3" stroke-width="1.2"/>
  <text x="163" y="138" text-anchor="end" font-size="10" fill="#2e6fa3">f<tspan font-size="7" baseline-shift="sub">y</tspan> = 0.9</text>
  <!-- weights at the four tap centres -->
  <g font-size="10.5" font-weight="600" fill="#2e6fa3">
    <text x="186" y="122">0.08</text><text x="266" y="122">0.02</text>
    <text x="186" y="203">0.72</text><text x="266" y="203">0.18</text>
  </g>

  <!-- legend -->
  <rect x="60" y="326" width="12" height="12" fill="#f7f7f7" stroke="#333" stroke-width="1.2"/>
  <text x="78" y="336" font-size="10.5" fill="#333">last frame's pixels, with their centres</text>
  <rect x="60" y="346" width="12" height="12" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="78" y="356" font-size="10.5" fill="#333">this pixel's square, traced back by its velocity; its centre lands between four pixel centres</text>

  <!-- table: offsets and shifts for the horizontal axis -->
  <text x="330" y="80" font-size="11" font-weight="600" fill="#333">For the horizontal axis (u = x, v = y):</text>
  <g font-size="10.5" fill="#333">
    <text x="330" y="104" font-weight="600">tap</text>
    <text x="380" y="104" font-weight="600">weight</text>
    <text x="432" y="104" font-weight="600">offset (o<tspan font-size="7" baseline-shift="sub">x</tspan>, o<tspan font-size="7" baseline-shift="sub">y</tspan>)</text>
    <text x="520" y="104" font-weight="600">shift of the mean</text>
    <line x1="330" y1="110" x2="610" y2="110" stroke="#999" stroke-width="0.8"/>
    <text x="330" y="126">(1, 0)</text><text x="380" y="126">0.08</text><text x="432" y="126">(0.2, 0.9)</text><text x="520" y="126">(−0.10, −0.90)</text>
    <text x="330" y="144">(2, 0)</text><text x="380" y="144">0.02</text><text x="432" y="144">(−0.8, 0.9)</text><text x="520" y="144">(+0.40, −0.90)</text>
    <text x="330" y="162">(1, 1)</text><text x="380" y="162">0.72</text><text x="432" y="162">(0.2, −0.1)</text><text x="520" y="162">(−0.10, +0.10)</text>
    <text x="330" y="180">(2, 1)</text><text x="380" y="180">0.18</text><text x="432" y="180">(−0.8, −0.1)</text><text x="520" y="180">(+0.40, +0.10)</text>
  </g>
  <g font-size="10.5" fill="#333">
    <text x="330" y="212">The offset is this pixel's centre relative to the</text>
    <text x="330" y="226">tap's centre; the mean moves by (−½o<tspan font-size="7" baseline-shift="sub">x</tspan>, −o<tspan font-size="7" baseline-shift="sub">y</tspan>): half</text>
    <text x="330" y="240">rate along the axis, full rate across. Each tap's</text>
    <text x="330" y="254">sample count is multiplied by its weight, and</text>
    <text x="330" y="268">the four records are merged. The merged</text>
    <text x="330" y="282">count is the interpolated count:</text>
    <text x="330" y="300">n = 0.08 n<tspan font-size="7" baseline-shift="sub">(1,0)</tspan> + 0.02 n<tspan font-size="7" baseline-shift="sub">(2,0)</tspan> + 0.72 n<tspan font-size="7" baseline-shift="sub">(1,1)</tspan> + 0.18 n<tspan font-size="7" baseline-shift="sub">(2,1)</tspan></text>
  </g>
</svg>
